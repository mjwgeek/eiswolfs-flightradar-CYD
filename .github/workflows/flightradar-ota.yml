name: Build and publish FlightRadar OTA

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "platformio.ini"
      - ".github/workflows/flightradar-ota.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flightradar-ota
  cancel-in-progress: false

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout firmware source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check "platformio>=6.1,<7"
      - name: Build ESP32 firmware
        run: pio run -e esp32dev
      - name: Validate OTA binary and version
        shell: bash
        run: |
          set -euo pipefail
          test -s .pio/build/esp32dev/firmware.bin
          bytes=$(stat -c '%s' .pio/build/esp32dev/firmware.bin)
          echo "Firmware bytes: $bytes"
          test "$bytes" -le 1966080
          grep -F 'APP_VERSION = "6.9.3"' src/config.h
          cp .pio/build/esp32dev/firmware.bin firmware.bin
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          before = '<span id="versionLabel">v6.9.2</span>'
          after = '<span id="versionLabel">v6.9.3</span>'
          if before not in s and after not in s:
              raise SystemExit("Web flasher version marker not found")
          s = s.replace(before, after)
          before_option = '<option value="manifest.json" data-version="v6.9.2" selected>v6.9.2 (latest)</option>'
          after_option = '<option value="manifest.json" data-version="v6.9.3" selected>v6.9.3 (latest)</option>'
          if before_option not in s and after_option not in s:
              raise SystemExit("Web flasher latest-version option not found")
          s = s.replace(before_option, after_option)
          s = s.replace("https://github.com/Eiswolf-BG/eiswolfs-flightradar-CYD",
                        "https://github.com/mjwgeek/eiswolfs-flightradar-CYD")
          p.write_text(s, encoding="utf-8")
          PY
      - name: Update web-flasher binary on main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware.bin index.html
          if ! git diff --cached --quiet; then
            git commit -m "build: publish FlightRadar v6.9.3 firmware.bin"
            git push origin HEAD:main
          fi
      - name: Publish OTA GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v6.9.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v6.9.3 firmware.bin --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit v6.9.3 --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create v6.9.3 firmware.bin \
              --repo "$GITHUB_REPOSITORY" \
              --target main \
              --title "FlightRadar v6.9.3 - ADSB.fi primary and fork OTA" \
              --notes "ADSB.fi v3 is the preferred aircraft feed; ADSB.lol is the fallback. Includes streaming/TLS error handling and kilometer-to-nautical-mile correction. Firmware OTA checks now target mjwgeek's releases." \
              --latest
          fi
