name: Build and publish FlightRadar OTA

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "platformio.ini"
      - ".github/workflows/flightradar-ota.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flightradar-ota
  cancel-in-progress: false

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout firmware source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check "platformio>=6.1,<7"
      - name: Read firmware version
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'from pathlib import Path; print(next(line.split(chr(34))[1] for line in Path("src/config.h").read_text().splitlines() if "APP_VERSION =" in line and chr(34) in line))')
          test -n "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build ESP32 firmware
        run: pio run -e esp32dev
      - name: Validate binary and update web-flasher metadata
        shell: bash
        run: |
          set -euo pipefail
          test -s .pio/build/esp32dev/firmware.bin
          bytes=$(stat -c '%s' .pio/build/esp32dev/firmware.bin)
          echo "Firmware bytes: $bytes / 1966080 (OTA partition)"
          test "$bytes" -le 1966080
          cp .pio/build/esp32dev/firmware.bin firmware.bin
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          version = os.environ["VERSION"]
          s, n1 = re.subn(r'(id="versionLabel">)v\d+\.\d+\.\d+',
                          lambda m: m.group(1) + "v" + version, s, count=1)
          s, n2 = re.subn(
              r'(<option value="manifest\.json" data-version=")v\d+\.\d+\.\d+(" selected>)v\d+\.\d+\.\d+',
              lambda m: m.group(1) + "v" + version + m.group(2) + "v" + version,
              s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("Web flasher version markers not found")
          s = s.replace("https://github.com/Eiswolf-BG/eiswolfs-flightradar-CYD",
                        "https://github.com/mjwgeek/eiswolfs-flightradar-CYD")
          p.write_text(s, encoding="utf-8")
          PY
      - name: Preserve compiled firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: flightradar-esp32
          path: firmware.bin
      - name: Publish compiled binary for web flashing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware.bin index.html
          if ! git diff --cached --quiet; then
            git commit -m "build: publish FlightRadar v$VERSION firmware.bin"
            git push origin HEAD:main
          fi
      - name: Publish OTA release on this fork
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$VERSION" firmware.bin --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "v$VERSION" --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create "v$VERSION" firmware.bin \
              --repo "$GITHUB_REPOSITORY" \
              --target main \
              --title "FlightRadar v$VERSION - ADSB.fi primary and fork OTA" \
              --notes "ADSB.fi v3 is the preferred feed, ADSB.lol the fallback. Contains streaming/TLS reliability fixes and correct distance units. The OTA checker points at this fork." \
              --latest
          fi
