name: Build Hosyond CYD40 Flightradar

on:
  push:
    branches: [hosyond-cyd40]
  pull_request:
    branches: [hosyond-cyd40]
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Build 4.0-inch firmware
        run: pio run -e hosyond-cyd40
      - name: Check flash images
        run: |
          test -s .pio/build/hosyond-cyd40/firmware.bin
          test -s .pio/build/hosyond-cyd40/bootloader.bin
          test -s .pio/build/hosyond-cyd40/partitions.bin
      - name: Upload board-specific images
        uses: actions/upload-artifact@v4
        with:
          name: flightradar-hosyond-cyd40
          path: |
            .pio/build/hosyond-cyd40/bootloader.bin
            .pio/build/hosyond-cyd40/partitions.bin
            .pio/build/hosyond-cyd40/firmware.bin
          if-no-files-found: error
